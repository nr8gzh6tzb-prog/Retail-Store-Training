<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign-off</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Training Sign-off</h1>
<!-- Submissions go to Formspree. Set FORMSPREE_URL in config.js to your endpoint (formspree.io → New form). -->
<form id="f" method="POST">
<label>Full name</label><input name="name" required>
<label>Typed signature</label><input name="signature" required placeholder="Type your full name as signature">
<label>Date</label><input type="date" name="date" required>
<p><a class="btn back" href="video8.html">← Back</a>
<button class="btn" type="submit">Submit sign-off</button></p>
</form>
<script src="config.js"></script><script src="app.js"></script>
<script>guard(TOTAL);const f=document.getElementById("f");f.action=FORMSPREE_URL;f.date.valueAsDate=new Date();</script>
</body></html>
